name: Build installers

# Builds Kodigo for Windows and Linux.
#
# Each installer is built on its own operating system rather than cross-compiled:
# Tauri links against the system webview (WebView2 on Windows, WebKitGTK on
# Linux), and the Windows MSI in particular cannot be produced anywhere but
# Windows. Running the matrix is the only way to get every format.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish the installers under"
        required: false
        default: "manual-build"

# The repository's default token is read-only, which is the right default. The
# build job needs to write exactly one thing: the draft release it attaches the
# installers to.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux
            # 22.04 rather than latest: the AppImage runs on the glibc it was
            # built against and anything newer, so building on the oldest
            # supported runner gives the widest reach.
            args: ""
          - platform: windows-latest
            name: windows
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check
        run: |
          npm run test
          npx tsc --noEmit

      - name: Test the Rust side
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Builds only. Attaching the installers is done below rather than here:
      # this action deletes an existing asset before replacing it, so a failed
      # upload leaves the release with less on it than before, and re-running
      # the job makes things worse instead of better.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # Kept whatever happened above, so a failed upload never costs the build.
      - name: Keep the installers as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodigo-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach the installers to the release
        # Windows runners default to PowerShell, which cannot parse this.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail

          # Both jobs race to do this; whichever arrives second is told the
          # release already exists, which is the outcome either way.
          gh release create "$TAG" --draft --title "Kodigo $TAG" \
            --notes "Installers for Windows and Linux." 2>/dev/null || true

          shopt -s nullglob
          installers=(
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          )
          if [ ${#installers[@]} -eq 0 ]; then
            echo "No installers were produced." >&2
            exit 1
          fi

          # One at a time, with retries. The asset API returns a server error on
          # larger files often enough that a single attempt is not dependable,
          # and --clobber replaces rather than deleting first.
          for installer in "${installers[@]}"; do
            for attempt in 1 2 3 4; do
              if gh release upload "$TAG" "$installer" --clobber; then
                echo "uploaded $(basename "$installer")"
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "giving up on $(basename "$installer")" >&2
                exit 1
              fi
              echo "retrying $(basename "$installer") in ${attempt}0s"
              sleep "${attempt}0"
            done
          done
